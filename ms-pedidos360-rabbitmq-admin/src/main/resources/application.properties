
spring.application.name=ms-pedidos360-rabbitmq-admin

# Puerto del microservicio administrador
server.port=8083

# API de administracion de RabbitMQ
rabbitmq.management.url=${RABBITMQ_MANAGEMENT_URL:http://localhost:15672}
rabbitmq.management.username=${RABBITMQ_MANAGEMENT_USERNAME:pedidos360}
rabbitmq.management.password=${RABBITMQ_PASSWORD:}

# Required external Microsoft Entra ID configuration; no default identity values.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ENTRA_JWT_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${ENTRA_JWT_AUDIENCE}
