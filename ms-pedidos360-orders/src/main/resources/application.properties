spring.application.name=ms-pedidos360-orders

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pedidos360_orders}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update

server.port=${PORT:8081}

catalog.service.url=${CATALOG_SERVICE_URL:http://localhost:8082}

# Conexion con RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:pedidos360}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}

# Confirmacion manual de mensajes RabbitMQ
spring.rabbitmq.listener.simple.acknowledge-mode=manual
# Same Entra API identity as the BFF; overridable per environment.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ENTRA_JWT_ISSUER_URI:https://login.microsoftonline.com/7d9b0753-76e0-4904-bc68-abb1c917b695/v2.0}
spring.security.oauth2.resourceserver.jwt.audiences=${ENTRA_JWT_AUDIENCE:6faf8448-cd68-430c-a4f6-4ac7726e5faa}

# Host: localhost:19092,localhost:19093,localhost:19094
# Docker (red Kafka): KAFKA_BOOTSTRAP_SERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092,localhost:19093,localhost:19094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties[spring.json.add.type.headers]=false
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties[enable.idempotence]=true
spring.kafka.producer.properties[max.block.ms]=2000
spring.kafka.producer.properties[request.timeout.ms]=5000
spring.kafka.producer.properties[delivery.timeout.ms]=20000
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties[spring.deserializer.key.delegate.class]=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties[spring.deserializer.value.delegate.class]=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=cl.duoc.pedidos360.orders.dto.PedidoEvento
spring.kafka.consumer.properties[spring.json.use.type.headers]=false
spring.kafka.consumer.properties[spring.json.trusted.packages]=cl.duoc.pedidos360.orders.dto
spring.kafka.consumer.properties[allow.auto.create.topics]=false
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record
spring.kafka.listener.auto-startup=${KAFKA_LISTENERS_ENABLED:true}
spring.kafka.listener.missing-topics-fatal=true
pedidos360.kafka.topics.eventos=pedidos.eventos
pedidos360.kafka.topics.analitica=pedidos.analitica
pedidos360.kafka.groups.eventos=${KAFKA_EVENTOS_GROUP:pedidos360-orders-eventos}
pedidos360.kafka.groups.analitica=${KAFKA_ANALITICA_GROUP:pedidos360-orders-analitica}
pedidos360.kafka.groups.seguimiento=${KAFKA_SEGUIMIENTO_GROUP:pedidos360-orders-seguimiento}
pedidos360.kafka.seguimiento.enabled=${KAFKA_SEGUIMIENTO_ENABLED:true}
pedidos360.kafka.retry.interval-ms=1000
pedidos360.kafka.retry.max-retries=2
