spring.application.name=ms-pedidos360-orders

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pedidos360_orders}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update

server.port=${PORT:8081}

catalog.service.url=${CATALOG_SERVICE_URL:http://localhost:8082}

# Conexion con RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:pedidos360}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}

# Confirmacion manual de mensajes RabbitMQ
spring.rabbitmq.listener.simple.acknowledge-mode=manual
# Same Entra API identity as the BFF; overridable per environment.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ENTRA_JWT_ISSUER_URI:https://login.microsoftonline.com/7d9b0753-76e0-4904-bc68-abb1c917b695/v2.0}
spring.security.oauth2.resourceserver.jwt.audiences=${ENTRA_JWT_AUDIENCE:6faf8448-cd68-430c-a4f6-4ac7726e5faa}
